[package]
name = "wami-macros"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Procedural macros for WAMI, the multi-cloud IAM library"
repository = "https://github.com/Lsh0x/wami"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
