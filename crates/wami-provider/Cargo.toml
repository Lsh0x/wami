[package]
name = "wami-provider"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cloud provider abstractions for the WAMI workspace"

[dependencies]
wami-core = { path = "../wami-core" }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
regex = "1.10"

