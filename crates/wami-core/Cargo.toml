[package]
name = "wami-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Core primitives shared across the WAMI workspace"

[dependencies]
aws-sdk-iam = "1.0"
aws-sdk-sts = "1.0"
aws-sdk-ssoadmin = "1.92"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

