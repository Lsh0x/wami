[package]
name = "wami-core"
version = "0.17.0"
edition = "2021"
license = "MIT"
description = "Core primitives for wami: ARNs, contexts, errors and shared types"
authors = ["LSH <github@lsh.tech>"]
rust-version = "1.90.0"
repository = "https://github.com/Lsh0x/wami"
homepage = "https://github.com/Lsh0x/wami"
documentation = "https://docs.rs/wami-core"
readme = "README.md"
keywords = ["iam", "identity", "arn", "multicloud"]
categories = ["api-bindings", "authentication"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[features]
# No provider by default. A deployment that is its own identity provider —
# no AWS, no GCP — should not compile translations for clouds it never calls.
default = []
aws = []
gcp = []
azure = []
scaleway = []
all-providers = ["aws", "gcp", "azure", "scaleway"]
