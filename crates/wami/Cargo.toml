[package]
name = "wami"
version = "0.17.1"
authors = ["LSH <github@lsh.tech>"]
edition = "2021"
rust-version = "1.90.0"
description = "Who Am I - Multicloud Identity, IAM, STS, and SSO operations library for Rust"
license = "MIT"
repository = "https://github.com/Lsh0x/wami"
homepage = "https://github.com/Lsh0x/wami"
documentation = "https://docs.rs/wami"
readme = "README.md"
keywords = ["iam", "sso", "identity", "multicloud", "aws"]
categories = ["api-bindings", "authentication", "development-tools"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
bcrypt = "0.18"
rand = "0.8"
getrandom = "0.2"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"], optional = true }
jsonwebtoken = { version = "9", optional = true }
roxmltree = "0.21"
wami-condition = { path = "../wami-condition", version = "0.17.1" }
wami-core = { path = "../wami-core", version = "0.18.0" }
wami-macros = { path = "../wami-macros", version = "0.17.0" }

[features]
# Provider translations, forwarded to wami-core. Off by default there, so off
# here unless asked for.
aws = ["wami-core/aws"]
gcp = ["wami-core/gcp"]
azure = ["wami-core/azure"]
scaleway = ["wami-core/scaleway"]
all-providers = ["wami-core/all-providers"]
default = ["sts-jwt"]
sts-jwt = ["dep:ed25519-dalek", "dep:jsonwebtoken"]

# Demonstrates every provider translation, so it only builds when they exist.
# Without this, `cargo check --all-targets` on a default build fails on an
# example rather than on anything a consumer would ship.
[[example]]
name = "25_arn_usage"
required-features = ["all-providers"]
