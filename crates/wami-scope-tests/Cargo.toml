[package]
name = "wami-scope-grafeo-tests"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "The wami-scope-gql fragment against a real graph store (Grafeo): tenants, principals, projects, the harness. Tests only, never published."
# Grafeo 0.6 needs 1.99, above wami's MSRV: this crate is out of the
# workspace's default members and runs on stable in CI.
rust-version = "1.99.0"
publish = false

[dependencies]

[dev-dependencies]
grafeo = { version = "0.6", default-features = false, features = ["gql"] }
grafeo-common = "0.6"
proptest = "1.11"
wami-core = { path = "../wami-core" }
wami-scope = { path = "../wami-scope", features = ["harness"] }
wami-scope-gql = { path = "../wami-scope-gql" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
