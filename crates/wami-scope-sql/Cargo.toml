[package]
name = "wami-scope-sql"
version = "0.2.2"
edition = "2021"
license = "MIT"
description = "A wami scope rendered as a parameterized SQLite SQL filter"
rust-version = "1.90.0"
repository = "https://github.com/Lsh0x/wami"
readme = "README.md"

[dependencies]
thiserror = "2.0"
wami-scope = { path = "../wami-scope", version = "0.1.2" }

[dev-dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1"
wami-core = { path = "../wami-core", version = "0.21.1" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
