[package]
name = "wami-scope"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A principal's policies compiled into what a query may reach: the ARN patterns allowed and denied, for a store to narrow before it answers"
rust-version = "1.90.0"
repository = "https://github.com/Lsh0x/wami"
homepage = "https://github.com/Lsh0x/wami"
documentation = "https://docs.rs/wami-scope"
readme = "README.md"
keywords = ["iam", "policy", "authorization", "scope", "multi-tenant"]
categories = ["authentication"]
authors = ["LSH <github@lsh.tech>"]

[dependencies]
thiserror = "2.0"
wami-core = { path = "../wami-core", version = "0.20.0" }

# The world, the oracle and the suite that hold every translator to the
# invariant are in `wami-scope-tests`, not here: this crate is the scope.

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
