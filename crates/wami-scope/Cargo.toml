[package]
name = "wami-scope"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A principal's policies compiled into what a query may reach: the ARN patterns allowed and denied, for a store to narrow before it answers"
rust-version = "1.90.0"
repository = "https://github.com/Lsh0x/wami"
homepage = "https://github.com/Lsh0x/wami"
documentation = "https://docs.rs/wami-scope"
readme = "README.md"
keywords = ["iam", "policy", "authorization", "scope", "multi-tenant"]
categories = ["authentication"]
authors = ["LSH <github@lsh.tech>"]

[dependencies]
thiserror = "2.0"
wami-core = { path = "../wami-core", version = "0.19.0" }
# The harness: the evaluator is the oracle every translator is held to.
wami = { path = "../wami", version = "0.18.0", optional = true }
proptest = { version = "1.11", optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
# The crate's own tests run the harness it ships.
wami-scope = { path = ".", features = ["harness"] }

[features]
default = []
# The conformance harness (`wami_scope::harness`): a world of tenants,
# principals and resources, the evaluator as oracle, random policies, and the
# checks a translator runs from its own tests. Test code shipped for other
# crates' tests, not something a consumer runs.
harness = ["dep:wami", "dep:proptest", "dep:serde_json"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
