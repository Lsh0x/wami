[workspace]
members = [
    "crates/wami-core",
    "crates/wami-condition",
    "crates/wami-service",
    "crates/wami",
    "crates/wami-macros",
    "crates/wami-scope",
    "crates/wami-scope-gql",
    "crates/wami-scope-tests",
]
# wami-scope-tests holds the scope's world, oracle and suite, and runs them
# on real stores; Grafeo 0.6 needs a toolchain newer than wami's MSRV (1.99),
# so `cargo test` at the root leaves it out and CI runs it on stable
# (`cargo test -p wami-scope-tests`).
default-members = [
    "crates/wami-core",
    "crates/wami-condition",
    "crates/wami-service",
    "crates/wami",
    "crates/wami-macros",
    "crates/wami-scope",
    "crates/wami-scope-gql",
]

resolver = "2"
