name: MSRV

on:
  push:
    branches: [main, master, feature/**]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 1' # Run weekly on Monday

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Check Minimum Supported Rust Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get MSRV from Cargo.toml
        id: msrv
        run: |
          # Check root Cargo.toml first
          MSRV=$(grep -m1 'rust-version' Cargo.toml 2>/dev/null | sed 's/.*"\(.*\)".*/\1/' || true)
          
          # If not found, check workspace member crates
          if [ -z "$MSRV" ]; then
            MSRV=$(grep -m1 'rust-version' crates/*/Cargo.toml 2>/dev/null | head -1 | sed 's/.*"\(.*\)".*/\1/' || true)
          fi
          
          # If still not found, use minimum version that supports Cargo.lock v4 (1.68.0)
          if [ -z "$MSRV" ]; then
            echo "No rust-version specified in Cargo.toml files, defaulting to 1.68.0 (minimum for Cargo.lock v4)"
            MSRV="1.68.0"
          fi
          
          echo "msrv=$MSRV" >> $GITHUB_OUTPUT
          echo "Minimum Supported Rust Version: $MSRV"

      - name: Install Rust toolchain ${{ steps.msrv.outputs.msrv }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check with MSRV
        run: cargo check --all-features --verbose

      - name: Test with MSRV
        run: cargo test --all-features --verbose

