name: Release Please

# Versioning is decided here and nowhere else. A release becomes a pull request
# that can be read and reverted, instead of a side effect of merging to main —
# which is how v0.12.0 came to be tagged while Cargo.toml still said 0.11.0.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Cargo.lock records the workspace member versions, so it moves with them.
      # Left alone, the next build would rewrite it and the release commit would
      # no longer describe what it released.
      - uses: actions/checkout@v5
        if: ${{ steps.release.outputs.pr }}
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ steps.release.outputs.pr }}

      - name: Refresh Cargo.lock on the release branch
        if: ${{ steps.release.outputs.pr }}
        run: |
          cargo update --workspace --offline || cargo update --workspace
          if ! git diff --quiet Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore: sync Cargo.lock with the released versions"
            git push
          fi
